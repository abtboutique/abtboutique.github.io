<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABT Boutique</title>
<style>
:root{--bg:#faf7f0;--card:#fff;--tx:#1b1b1b;--mut:#6b6659;--gold:#b8892b;--bd:#e6dfcf;--btn:#1b1b1b;--btx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--card:#1f1d19;--tx:#f3efe6;--mut:#a39d8d;--gold:#d8a94a;--bd:#34302a;--btn:#d8a94a;--btx:#141311}}
:root[data-theme="dark"]{--bg:#141311;--card:#1f1d19;--tx:#f3efe6;--mut:#a39d8d;--gold:#d8a94a;--bd:#34302a;--btn:#d8a94a;--btx:#141311}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,"Times New Roman",serif;padding-bottom:90px}
header{text-align:center;padding:22px 16px 10px}
h1{margin:0;font-size:34px;letter-spacing:6px;color:var(--gold)}
header p{margin:6px 0 0;color:var(--mut);font-size:14px;font-family:system-ui,sans-serif}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 16px;border-radius:20px;font-size:14px;font-family:system-ui,sans-serif}
nav button.on{background:var(--btn);color:var(--btx);border-color:var(--btn)}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;font-family:system-ui,sans-serif}
.ph{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:54px;background:var(--bd)}
.ph img{width:100%;height:100%;object-fit:cover}
.in{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.in b{font-size:14px;font-weight:600}
select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px}
.add{margin-top:auto;border:0;background:var(--btn);color:var(--btx);padding:10px;border-radius:10px;font-size:14px;font-weight:600}
#bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btx);border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:600;font-family:system-ui,sans-serif;display:none;z-index:8;width:calc(100% - 24px)}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px;font-family:system-ui,sans-serif}
#sheet h2{font-family:Georgia,serif;color:var(--gold);margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.row div{flex:1;font-size:14px}.row small{color:var(--mut)}
.q{display:flex;align-items:center;gap:8px}
.q button{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:18px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;margin-bottom:10px}
.send{width:100%;border:0;background:#25a244;color:#fff;padding:15px;border-radius:12px;font-size:16px;font-weight:600}
.back{border:0;background:none;color:var(--gold);font-size:16px;padding:0 0 12px}
.contact{display:block;width:fit-content;margin:6px auto 4px;background:#25a244;color:#fff;text-decoration:none;font-family:system-ui,sans-serif;font-weight:600;font-size:15px;padding:11px 20px;border-radius:24px}
.pr{color:var(--gold);font-weight:700;font-size:15px}
.note{color:var(--mut);font-size:13px;text-align:center;margin:12px 0}
</style>
</head>

// Prix en dollars : ajoutez une ligne "Nom du produit": prix
var PRIX = {"Montre Classique Or Cuir Marron":30,"Montre Automatique Acier":25,"Montre Sport Noir":20,"Montre Rose Gold Femme":30,"Montre Classique Blanche Cuir Blanc":22,"Montre Bleue Cuir Bleu":25,"Parfum Oriental Ambre":20,"Parfum Rose Fleur":15,"Parfum Bois Noir":25,"Parfum Vanille Douce":18,"Parfum Frais Citron":12,"Parfum Oud Royal":22,"Chaussure modèle 1":30,"Chaussure modèle 2":35,"Chaussure modèle 3":28,"Chaussure modèle 4":25,"Chaussure modèle 5":40,"Chaussure modèle 6":32,"Habit modèle 1":30,"Habit modèle 2":15,"Habit modèle 3":35,"Habit modèle 4":40,"Habit modèle 5":20,"Habit modèle 6":18,"Sac Structuré Beige":25,"Sac Matelassé Noir":30,"Sac Tote Cuir Marron":28,"Sac Bandoulière Blanc":22,"Sac à Main Rouge":20,"Sac Mini Rose":18,"Parfum Mousuf":"15.000 FC","Parfum GLO Noir & Or":"12.000 FC","Parfum Floral Romantic Blanc & Rouge":"10.000 FC","Parfum Gris/Or":"8.000 FC","Parfum Rose Poudré":"8.000 FC","Parfum Flamme Noir & Rouge":"10.000 FC","Parfum Pistache Vert Pastel":"8.000 FC","Sunny Vibes":"5.000 FC","Brumes Luxe Bouchons Dorés":"8.000 FC"};
function prix(p){ var v=PRIX[p.n]; if(!v) return "Prix sur demande"; return typeof v==="string" ? v : v+" $"; }
var cat = CATS[0].n, panier = [];
function find(n){ return CATS.filter(function(c){return c.n===n})[0]; }
function nav(){
 var h = "";
 CATS.forEach(function(c){ h += '<button class="'+(c.n===cat?'on':'')+'" data-c="'+c.n+'">'+c.e+' '+c.n+'</button>'; });
 document.getElementById("nav").innerHTML = h;
 document.querySelectorAll("#nav button").forEach(function(b){ b.onclick=function(){ cat=b.dataset.c; nav(); grid(); }; });
}
function grid(){
 var c = find(cat), h = "";
 PRODUITS.forEach(function(p,i){
  if (p.c!==cat) return;
  var ph = p.img ? '<img src="'+p.img+'" alt="'+p.n+'">' : c.e;
  var sel = "";
  if (c.o){ sel = '<select id="o'+i+'"><option value="">'+c.l+'</option>'; c.o.forEach(function(x){ sel += '<option>'+x+'</option>'; }); sel += '</select>'; }
  h += '<div class="card"><div class="ph">'+ph+'</div><div class="in"><b>'+p.n+'</b><span class="pr">'+prix(p)+'</span>'+sel+'<button class="add" data-i="'+i+'">Ajouter</button></div></div>';
 });
 document.getElementById("grid").innerHTML = h;
 document.querySelectorAll(".add").forEach(function(b){ b.onclick=function(){ ajouter(+b.dataset.i); }; });
}
function ajouter(i){
 var p = PRODUITS[i], c = find(p.c), opt = "";
 if (c.o){ opt = document.getElementById("o"+i).value; if(!opt){ alert("Choisissez d’abord : "+c.l); return; } }
 var ex = panier.filter(function(x){return x.i===i && x.opt===opt})[0];
 if (ex) ex.q++; else panier.push({i:i, opt:opt, q:1, l:c.l});
 bar();
}
function bar(){
 var t = panier.reduce(function(s,x){return s+x.q},0), b = document.getElementById("bar");
 b.style.display = t ? "block" : "none";
 b.textContent = "Voir ma commande (" + t + ")";
}
function liste(){
 var h = "";
 if (!panier.length) h = '<p class="note">Votre panier est vide.</p>';
 panier.forEach(function(x,k){
  h += '<div class="row"><div><b>'+PRODUITS[x.i].n+'</b><br><small>'+(x.opt? x.l+' : '+x.opt : '')+'</small></div><div class="q"><button data-k="'+k+'" data-d="-1">−</button><span>'+x.q+'</span><button data-k="'+k+'" data-d="1">+</button></div></div>';
 });
 document.getElementById("items").innerHTML = h;
 document.querySelectorAll(".q button").forEach(function(b){ b.onclick=function(){
  var x = panier[+b.dataset.k]; x.q += +b.dataset.d;
  if (x.q<=0) panier.splice(+b.dataset.k,1);
  liste(); bar();
 }; });
}
document.getElementById("bar").onclick = function(){ liste(); document.getElementById("sheet").style.display="block"; };
document.getElementById("back").onclick = function(){ document.getElementById("sheet").style.display="none"; };
document.getElementById("send").onclick = function(){
 if (!panier.length){ alert("Votre panier est vide."); return; }
 var nom = document.getElementById("nom").value.trim(), adr = document.getElementById("adr").value.trim();
 if (!nom || !adr){ alert("Entrez votre nom et votre quartier."); return; }
 var m = "Bonjour ABT, je voudrais commander :\n";
 panier.forEach(function(x){ m += "• "+PRODUITS[x.i].n+(PRIX[PRODUITS[x.i].n]?" ("+prix(PRODUITS[x.i])+")":"")+(x.opt?" ("+x.l+" "+x.opt+")":"")+" × "+x.q+"\n"; });
 m += "\nNom : "+nom+"\nQuartier : "+adr+"\n\nMerci de m’indiquer les prix et la livraison.";
 window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(m), "_blank");
};
nav(); grid();
